<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="url(#bg)"/>

  <text x="56" y="58" font-family="Menlo, monospace" font-size="28" font-weight="bold" fill="#e6edf3">One character, silently removed</text>
  <text x="57" y="88" font-family="Menlo, monospace" font-size="15" fill="#7d8590">Nothing warned. Nothing logged a parse error. The connection just failed.</text>
  <text x="1144" y="58" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="end">ibtisam-iq</text>

  <text x="56" y="134" font-family="Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#8b949e">WHAT I WROTE IN .env</text>
  <rect x="56" y="148" width="1088" height="54" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="76" y="181" font-family="Menlo, monospace" font-size="15" fill="#c9d1d9">SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/db?useSSL=false<tspan fill="#f85149" font-weight="bold">&amp;</tspan>serverTimezone=UTC</text>

  <text x="56" y="244" font-family="Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#f85149">WHAT THE JVM RECEIVED</text>
  <rect x="56" y="258" width="1088" height="54" rx="10" fill="#2a1416" stroke="#f85149" stroke-width="1.5"/>
  <text x="76" y="291" font-family="Menlo, monospace" font-size="15" fill="#c9d1d9">SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/db?useSSL=false</text>
  <text x="1124" y="291" font-family="Menlo, monospace" font-size="13" fill="#f85149" text-anchor="end">a valid URL, just not yours</text>

  <rect x="56" y="336" width="1088" height="58" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
  <text x="76" y="362" font-family="Menlo, monospace" font-size="14" fill="#7d8590">Unquoted, <tspan fill="#e6edf3" font-weight="bold">&amp;</tspan> is not part of the string. It is the shell's background operator, so the line ends there</text>
  <text x="76" y="384" font-family="Menlo, monospace" font-size="14" fill="#7d8590">and the rest is run as a separate command. The shell did exactly what it is documented to do.</text>

  <rect x="56" y="412" width="1088" height="42" rx="10" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
  <text x="76" y="439" font-family="Menlo, monospace" font-size="15" fill="#3fb950">FIX  SPRING_DATASOURCE_URL=<tspan font-weight="bold">"</tspan>jdbc:mysql://localhost:3306/db?useSSL=false&amp;serverTimezone=UTC<tspan font-weight="bold">"</tspan></text>

  <rect x="56" y="470" width="1088" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="74" y="494" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#e6edf3">Any query string in an environment variable has this problem. JDBC URLs are where most people meet it.</text>
</svg>
