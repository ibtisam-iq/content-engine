<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <pattern id="blocked" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2a1416"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f85149" stroke-width="3" opacity="0.5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="url(#bg)"/>

  <text x="56" y="60" font-family="Menlo, monospace" font-size="28" font-weight="bold" fill="#e6edf3">A gate you cannot pass is not a gate</text>
  <text x="57" y="90" font-family="Menlo, monospace" font-size="15" fill="#7d8590">Same app, same scanner, same threshold. Only the base image changed.</text>

  <!-- LEFT: alpine -->
  <rect x="56" y="126" width="520" height="212" rx="12" fill="url(#blocked)" stroke="#f85149" stroke-width="1.5"/>
  <text x="80" y="160" font-family="Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#f85149">BEFORE</text>
  <text x="80" y="192" font-family="Menlo, monospace" font-size="21" font-weight="bold" fill="#e6edf3">alpine</text>
  <text x="80" y="232" font-family="Menlo, monospace" font-size="34" font-weight="bold" fill="#f85149">5 to 15</text>
  <text x="80" y="256" font-family="Menlo, monospace" font-size="14" fill="#7d8590">critical CVEs in the OS layer</text>
  <text x="80" y="290" font-family="Menlo, monospace" font-size="15" fill="#f85149">every one: no fix available</text>
  <text x="80" y="316" font-family="Menlo, monospace" font-size="14" fill="#7d8590">musl patches lag upstream by weeks</text>

  <!-- RIGHT: jammy -->
  <rect x="624" y="126" width="520" height="212" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="648" y="160" font-family="Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#3fb950">AFTER</text>
  <text x="648" y="192" font-family="Menlo, monospace" font-size="21" font-weight="bold" fill="#e6edf3">ubuntu 22.04</text>
  <text x="648" y="232" font-family="Menlo, monospace" font-size="34" font-weight="bold" fill="#3fb950">0</text>
  <text x="648" y="256" font-family="Menlo, monospace" font-size="14" fill="#7d8590">critical CVEs in the OS layer</text>
  <text x="648" y="290" font-family="Menlo, monospace" font-size="15" fill="#3fb950">gate passes on its own</text>
  <text x="648" y="316" font-family="Menlo, monospace" font-size="14" fill="#7d8590">Canonical patches glibc in hours</text>

  <!-- the design point -->
  <line x1="56" y1="374" x2="1144" y2="374" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="56" y="410" font-family="Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#6e7681">THE SECOND HALF OF THE FIX: SPLIT THE SCAN BY WHO OWNS THE FIX</text>
  <text x="56" y="440" font-family="Menlo, monospace" font-size="16" fill="#e6edf3" xml:space="preserve">OS packages <tspan fill="#7d8590">belong to the base image vendor, so they</tspan> <tspan fill="#d29922">report</tspan></text>
  <text x="56" y="464" font-family="Menlo, monospace" font-size="16" fill="#e6edf3" xml:space="preserve">App libraries <tspan fill="#7d8590">are mine, I can bump a version, so that is where</tspan> <tspan fill="#f85149">enforcement</tspan> <tspan fill="#7d8590">belongs</tspan></text>
</svg>
