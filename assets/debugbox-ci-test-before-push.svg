<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="url(#bg)"/>

  <text x="56" y="66" font-family="Menlo, monospace" font-size="30" font-weight="bold" fill="#e6edf3">Test before push</text>
  <text x="57" y="96" font-family="Menlo, monospace" font-size="16" fill="#7d8590">Nothing reaches the registry until it has passed everything</text>

  <text x="56" y="146" font-family="Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#6e7681">EVERY COMMIT BUILDS 6 IMAGES  ·  3 VARIANTS × 2 ARCH</text>

  <!-- build -->
  <rect x="56" y="162" width="150" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="131" y="200" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">build</text>
  <text x="131" y="224" font-family="Menlo, monospace" font-size="13" fill="#7d8590" text-anchor="middle">6 images</text>
  <line x1="206" y1="205" x2="236" y2="205" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- size -->
  <rect x="238" y="162" width="150" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="313" y="200" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">size</text>
  <text x="313" y="224" font-family="Menlo, monospace" font-size="13" fill="#7d8590" text-anchor="middle">compressed MB</text>
  <line x1="388" y1="205" x2="418" y2="205" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- smoke -->
  <rect x="420" y="162" width="150" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="495" y="200" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">smoke</text>
  <text x="495" y="224" font-family="Menlo, monospace" font-size="13" fill="#7d8590" text-anchor="middle">runtime checks</text>
  <line x1="570" y1="205" x2="600" y2="205" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Trivy -->
  <rect x="602" y="162" width="150" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="677" y="200" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">Trivy</text>
  <text x="677" y="224" font-family="Menlo, monospace" font-size="13" fill="#7d8590" text-anchor="middle">HIGH/CRITICAL</text>
  <line x1="752" y1="205" x2="786" y2="205" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- gate -->
  <text x="819" y="150" font-family="Menlo, monospace" font-size="13" letter-spacing="1" fill="#3fb950" text-anchor="middle">GATE</text>
  <rect x="790" y="160" width="58" height="90" rx="12" fill="#0d2818" stroke="#3fb950" stroke-width="2"/>
  <text x="819" y="217" font-family="Menlo, monospace" font-size="38" font-weight="bold" fill="#3fb950" text-anchor="middle">✓</text>
  <line x1="848" y1="205" x2="882" y2="205" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- registry -->
  <rect x="886" y="162" width="258" height="86" rx="10" fill="#10203a" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="1015" y="200" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">registry</text>
  <text x="1015" y="224" font-family="Menlo, monospace" font-size="13" fill="#7d8590" text-anchor="middle">GHCR + Docker Hub</text>

  <!-- bracket under checks -->
  <path d="M56,276 L56,286 L752,286 L752,276" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="404" y="312" font-family="Menlo, monospace" font-size="14" fill="#6e7681" text-anchor="middle">built and tested locally  ·  never pushed</text>

  <!-- bottom caption -->
  <text x="56" y="368" font-family="Menlo, monospace" font-size="15" fill="#7d8590">Publishing is a separate, tag-triggered workflow that scans again, then pushes.</text>
</svg>
