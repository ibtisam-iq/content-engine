<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <marker id="ahRed" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff7b72"/>
    </marker>
    <marker id="ahGreen" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
    </marker>
    <marker id="ahBlue" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- ===== HEADER (shared baseline) ===== -->
  <text x="60" y="52" font-family="Menlo, monospace" font-size="14" fill="#ff7b72" letter-spacing="2.5">INBOUND</text>
  <text x="60" y="84" font-family="Menlo, monospace" font-size="24" font-weight="bold" fill="#e6edf3">What everyone tries</text>
  <text x="660" y="52" font-family="Menlo, monospace" font-size="14" fill="#3fb950" letter-spacing="2.5">OUTBOUND</text>
  <text x="660" y="84" font-family="Menlo, monospace" font-size="24" font-weight="bold" fill="#e6edf3">Reverse the direction</text>

  <line x1="600" y1="34" x2="600" y2="596" stroke="#21262d" stroke-width="1.5" stroke-dasharray="5 7"/>

  <!-- ===== BAND 1: endpoints, y 112..194 ===== -->
  <rect x="60" y="112" width="300" height="82" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="134" font-family="Menlo, monospace" font-size="13" fill="#e6edf3">jenkins.ibtisam-iq.com</text>
  <text x="80" y="156" font-family="Menlo, monospace" font-size="13" fill="#e6edf3">sonar.ibtisam-iq.com</text>
  <text x="80" y="178" font-family="Menlo, monospace" font-size="13" fill="#e6edf3">nexus.ibtisam-iq.com</text>

  <rect x="660" y="112" width="480" height="82" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="900" y="146" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">CLOUDFLARE EDGE</text>
  <text x="900" y="172" font-family="Menlo, monospace" font-size="12" fill="#8b949e" text-anchor="middle">TLS terminates here, no Certbot</text>

  <!-- ===== connectors ===== -->
  <line x1="210" y1="202" x2="210" y2="232" stroke="#ff7b72" stroke-width="2.5" marker-end="url(#ahRed)"/>
  <line x1="880" y1="378" x2="880" y2="204" stroke="#3fb950" stroke-width="2.5" marker-end="url(#ahGreen)"/>
  <line x1="928" y1="204" x2="928" y2="378" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ahBlue)"/>

  <!-- ===== BAND 2: the same gateway, y 240..300 ===== -->
  <rect x="60" y="240" width="510" height="60" rx="10" fill="#1c1114" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="80" y="266" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#ff7b72">NAT GATEWAY</text>
  <text x="80" y="286" font-family="Menlo, monospace" font-size="12" fill="#8b949e">three names, one address</text>
  <circle cx="500" cy="270" r="16" fill="#0d1220" stroke="#ff7b72" stroke-width="2.5"/>
  <line x1="492" y1="262" x2="508" y2="278" stroke="#ff7b72" stroke-width="2.5"/>
  <line x1="508" y1="262" x2="492" y2="278" stroke="#ff7b72" stroke-width="2.5"/>

  <rect x="660" y="240" width="480" height="60" rx="10" fill="#0b1a10" stroke="#3fb950" stroke-width="1.5"/>
  <text x="680" y="266" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#3fb950">NAT GATEWAY</text>
  <text x="680" y="286" font-family="Menlo, monospace" font-size="12" fill="#8b949e">outbound passes freely</text>

  <!-- ===== BAND 3: machines ===== -->
  <text x="60" y="326" font-family="Menlo, monospace" font-size="11.5" fill="#6e7681">SilverStack playground on iximiuz Labs, 172.16.0.0/24</text>

  <rect x="60" y="336" width="122" height="52" rx="10" fill="#0b0f17" stroke="#21262d" stroke-dasharray="4 4"/>
  <text x="121" y="367" font-family="Menlo, monospace" font-size="11" fill="#3d444d" text-anchor="middle">dev-machine</text>
  <text x="121" y="406" font-family="Menlo, monospace" font-size="10" fill="#6e7681" text-anchor="middle">not exposed</text>

  <rect x="189" y="336" width="122" height="52" rx="10" fill="#0b0f17" stroke="#21262d"/>
  <text x="250" y="367" font-family="Menlo, monospace" font-size="11" fill="#484f58" text-anchor="middle">jenkins-server</text>

  <rect x="318" y="336" width="122" height="52" rx="10" fill="#0b0f17" stroke="#21262d"/>
  <text x="379" y="367" font-family="Menlo, monospace" font-size="11" fill="#484f58" text-anchor="middle">sonarqube-server</text>

  <rect x="447" y="336" width="122" height="52" rx="10" fill="#0b0f17" stroke="#21262d"/>
  <text x="508" y="367" font-family="Menlo, monospace" font-size="11" fill="#484f58" text-anchor="middle">nexus-server</text>

  <text x="660" y="348" font-family="Menlo, monospace" font-size="12.5" fill="#3fb950">1. daemon dials out</text>
  <text x="962" y="348" font-family="Menlo, monospace" font-size="12.5" fill="#58a6ff">2. traffic returns</text>

  <rect x="660" y="380" width="480" height="94" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="900" y="412" font-family="Menlo, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">cloudflared &#8594; nginx :80</text>
  <text x="900" y="436" font-family="Menlo, monospace" font-size="12" fill="#8b949e" text-anchor="middle">jenkins :8080  sonarqube :9000  nexus :8081</text>
  <text x="900" y="458" font-family="Menlo, monospace" font-size="11.5" fill="#6e7681" text-anchor="middle">no public IP, zero inbound ports</text>

  <!-- ===== BAND 4: bullets, bottom-aligned ===== -->
  <circle cx="66" cy="429" r="3" fill="#ff7b72"/>
  <text x="84" y="434" font-family="Menlo, monospace" font-size="16" fill="#a8b3bd">Every name resolves to the same address</text>

  <circle cx="66" cy="463" r="3" fill="#ff7b72"/>
  <text x="84" y="468" font-family="Menlo, monospace" font-size="16" fill="#a8b3bd">Port forwarding needs a gateway you own</text>

  <circle cx="66" cy="497" r="3" fill="#ff7b72"/>
  <text x="84" y="502" font-family="Menlo, monospace" font-size="16" fill="#a8b3bd">HTTP-01 needs a reachable port 80</text>

  <circle cx="66" cy="531" r="3" fill="#ff7b72"/>
  <text x="84" y="536" font-family="Menlo, monospace" font-size="16" fill="#a8b3bd">Self-signed warns every visitor</text>

  <circle cx="666" cy="497" r="3" fill="#3fb950"/>
  <text x="684" y="502" font-family="Menlo, monospace" font-size="16" fill="#a8b3bd">Point the tunnel at Nginx, not the app port</text>

  <circle cx="666" cy="531" r="3" fill="#3fb950"/>
  <text x="684" y="536" font-family="Menlo, monospace" font-size="16" fill="#a8b3bd">One tunnel per service, not one shared</text>

  <!-- ===== BAND 5: punchlines, shared baseline ===== -->
  <text x="60" y="580" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#ff7b72">All four assume traffic must arrive.</text>
  <text x="660" y="580" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#3fb950">Real certificate. My domain. Nothing open.</text>
</svg>
