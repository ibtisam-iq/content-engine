<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2a1416"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f85149" stroke-width="3" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="url(#bg2)"/>
  <text x="56" y="52" font-family="Menlo, monospace" font-size="13" letter-spacing="2" fill="#6e7681">WHAT EACH PROBE CAN SEE</text>

  <!-- column headers over the two strata -->
  <text x="470" y="96" font-family="Menlo, monospace" font-size="14" fill="#f85149" text-anchor="middle">runtime overlay</text>
  <text x="860" y="96" font-family="Menlo, monospace" font-size="14" fill="#7d8590" text-anchor="middle">image layers</text>

  <!-- stratum labels -->
  <rect x="330" y="108" width="280" height="46" rx="8" fill="url(#hatch)" stroke="#f85149" stroke-width="1.5"/>
  <text x="470" y="137" font-family="Menlo, monospace" font-size="15" fill="#f85149" text-anchor="middle">/.dockerenv</text>

  <rect x="620" y="108" width="480" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="860" y="137" font-family="Menlo, monospace" font-size="15" fill="#e6edf3" text-anchor="middle">everything your Dockerfile wrote</text>

  <text x="330" y="184" font-family="Menlo, monospace" font-size="14" fill="#6e7681">written by Docker when a container is created, never stored in the image</text>

  <!-- probe rows -->
  <text x="56" y="248" font-family="Menlo, monospace" font-size="16" fill="#e6edf3">docker run</text>
  <rect x="330" y="228" width="770" height="34" rx="6" fill="#f85149" opacity="0.20" stroke="#f85149" stroke-width="1.5"/>
  <text x="1082" y="251" font-family="Menlo, monospace" font-size="15" fill="#f85149" text-anchor="end">sees both  ✗</text>

  <text x="56" y="308" font-family="Menlo, monospace" font-size="16" fill="#e6edf3">docker create</text>
  <text x="56" y="330" font-family="Menlo, monospace" font-size="16" fill="#e6edf3">+ export</text>
  <rect x="330" y="298" width="770" height="34" rx="6" fill="#f85149" opacity="0.20" stroke="#f85149" stroke-width="1.5"/>
  <text x="1082" y="321" font-family="Menlo, monospace" font-size="15" fill="#f85149" text-anchor="end">sees both  ✗</text>

  <text x="56" y="388" font-family="Menlo, monospace" font-size="16" fill="#e6edf3">docker save</text>
  <rect x="620" y="368" width="480" height="34" rx="6" fill="#3fb950" opacity="0.22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="1082" y="391" font-family="Menlo, monospace" font-size="15" fill="#3fb950" text-anchor="end">image only  ✓</text>

  <!-- boundary line -->
  <line x1="615" y1="104" x2="615" y2="412" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text x="56" y="466" font-family="Menlo, monospace" font-size="16" fill="#6e7681">Two probes span the overlay, so both report the file on every image, including a stock</text>
  <text x="56" y="492" font-family="Menlo, monospace" font-size="16" fill="#6e7681">ubuntu:24.04. Only the third stops at the boundary.</text>
</svg>
