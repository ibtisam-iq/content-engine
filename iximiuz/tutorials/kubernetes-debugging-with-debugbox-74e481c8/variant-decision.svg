<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="url(#bg)"/>

  <text x="56" y="78" font-family="Menlo, monospace" font-size="28" font-weight="bold" fill="#e6edf3">Which variant do I need?</text>

  <!-- Q1 -->
  <rect x="120" y="130" width="380" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="177" font-family="Menlo, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">Need packet analysis or nmap?</text>
  <!-- Q1 -> POWER -->
  <line x1="500" y1="170" x2="634" y2="170" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="567" y="158" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">YES</text>
  <rect x="642" y="140" width="240" height="60" rx="10" fill="#ff7b72"/>
  <text x="762" y="177" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#0b0f17" text-anchor="middle">power  ~91 MB</text>
  <!-- Q1 -> Q2 -->
  <line x1="310" y1="210" x2="310" y2="252" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="326" y="240" font-family="Menlo, monospace" font-size="15" fill="#6e7681">no</text>

  <!-- Q2 -->
  <rect x="120" y="260" width="380" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="310" y="307" font-family="Menlo, monospace" font-size="19" fill="#e6edf3" text-anchor="middle">Need tcpdump, TLS, or K8s tools?</text>
  <!-- Q2 -> BALANCED -->
  <line x1="500" y1="300" x2="634" y2="300" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="567" y="288" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">YES</text>
  <rect x="642" y="270" width="240" height="60" rx="10" fill="#e3b341"/>
  <text x="762" y="307" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#0b0f17" text-anchor="middle">balanced  ~47 MB</text>
  <!-- Q2 -> LITE -->
  <line x1="310" y1="340" x2="310" y2="392" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="326" y="372" font-family="Menlo, monospace" font-size="15" fill="#6e7681">no</text>

  <!-- LITE -->
  <rect x="120" y="400" width="380" height="60" rx="10" fill="#3fb950"/>
  <text x="310" y="437" font-family="Menlo, monospace" font-size="20" font-weight="bold" fill="#0b0f17" text-anchor="middle">lite  ~15 MB</text>
</svg>
